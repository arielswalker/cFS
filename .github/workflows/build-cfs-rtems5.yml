name: Build and Test RTEMS 5 [OMIT_DEPRECATED=true]

on:
  push:
  pull_request:

env:
  OMIT_DEPRECATED: true
  CTEST_OUTPUT_ON_FAILURE: true

defaults:
  run:
    shell: bash

jobs:
  # Checks for duplicate actions. Skips push actions if there is a matching or duplicate pull-request action.
  check-for-duplicates:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'

  build-cfs:
    name: Build
    needs: check-for-duplicates
    if: ${{ needs.check-for-duplicates.outputs.should_skip != 'true' }}
    runs-on: ubuntu-22.04
    container: ghcr.io/core-flight-system/qemu-rtems-5:latest

    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]

    env:
      BUILDTYPE: ${{ matrix.buildtype }}
      ENABLE_UNIT_TESTS: true
      HOME: /root
      MTOOLS_SKIP_CHECK: 1

    steps:
      - name: Set REPO_NAME
        run: echo "REPO_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Cache Source and Build
        id: cache-src-bld
        uses: actions/cache@v4
        with:
          path: ./
          key: rtems5-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.buildtype }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Copy Files
        run: |
          cp ./cfe/cmake/Makefile.sample Makefile
          cp -r ./cfe/cmake/sample_defs sample_defs

      - name: Make Prep
        run: make SIMULATION=i686-rtems5 prep

      - name: Make
        run: make

  test-cfs:
    name: Test
    needs: build-cfs
    runs-on: ubuntu-22.04
    container: ghcr.io/core-flight-system/qemu-rtems-5:latest

    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]

    steps:
      - name: Set REPO_NAME
        run: echo "REPO_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Cache Source and Build
        id: cache-src-bld
        uses: actions/cache@v4
        with:
          path: ./
          key: rtems5-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.buildtype }}

      - name: Test
        run: make O=build SKIP_NET_TESTS=true RTEMS_VERSION=i686-rtems5 -f .github/scripts/rtems-test.mk all_tests -k

      - name: Output Failed Tests
        run: |
          if [ -s ./build/exe/cpu1/failed-tests.log ]; then
            echo "Failing tests found:"
            cat ./build/exe/cpu1/failed-tests.log
          fi

      - name: Archive cFS Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cFS-rtems-log-summary-${{ matrix.buildtype }}
          path: ./build/exe/cpu1/*.log
