name: Static Analysis Reusable Workflow

on:
  workflow_call:
    inputs:
      # Optional inputs
      source-dir:
        description: Directory containing source files
        type: string
        default: 'fsw'

# Force bash to apply pipefail option so pipeline failures aren't masked
defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Run Static Analysis
    runs-on: ubuntu-22.04
    container: ghcr.io/arielswalker/cfsbuildenv-linux:latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Run cppcheck
        uses: arielswalker/cFS/actions/cppcheck@part-cfs/workflows#177-update-workflows-internal-logic
        id: run-cppcheck
        with:
          source-dir: source/${{ inputs.source-dir }}