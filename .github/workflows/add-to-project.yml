name: Add Issue or PR to Project

on:
  issues:
    types: [opened]
  # Testing purpose changed pull_request_target to pull_request
  # pull_request_target trigger always runs the workflow using the code that exists in the target (base) branch 
  pull_request:
    types: [opened, ready_for_review, converted_to_draft]

jobs:
  add-to-project:
    name: Add issue or pull request to project
    # do not run on integration candidate branches
    if: ${{ !startsWith(github.head_ref != '' && github.head_ref || github.ref_name, 'ic-') }}
    uses: arielswalker/cFS/.github/workflows/add-to-project-reusable.yml@test-cfs/workflows122
    secrets: inherit